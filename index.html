<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snap &amp; Segment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div class="workspace">
      <div id="acquire" class="video-wrap">
        <video id="video" playsinline muted></video>
        <div id="video-placeholder">Take a picture or upload a photo.</div>
      </div>
      <div id="annotate" class="stage" hidden>
        <canvas id="canvas"></canvas>
        <div id="busy" hidden><span class="spinner"></span><span id="busy-text"></span></div>
      </div>
    </div>

    <aside class="panel" aria-label="Controls">
      <div class="panel-content">
        <div id="model-status" class="status" role="status">Loading model…</div>
        <button id="btn-panel" aria-label="Move panel to left" title="Move panel to left">⇤ Move panel</button>
        <button id="btn-new" disabled>New picture</button>
        <section>
          <button id="btn-capture" class="primary">Take picture</button>
          <button id="btn-flip" hidden disabled>Switch camera</button>
          <button id="btn-upload">Upload picture</button>
          <input id="file-input" type="file" accept="image/*" hidden>
        </section>

        <section>
          <div class="tools" role="group" aria-label="Annotation tool">
            <button data-tool="box" class="tool active" title="Drag a box around an object (new object)" aria-pressed="true" disabled>▭ Box</button>
            <button data-tool="scribble" class="tool" title="Scribble on an object (new object)" aria-pressed="false" disabled>✎ Scribble</button>
            <button data-tool="pos" class="tool" title="Add an include point to the selected object" aria-pressed="false" disabled>＋ Point</button>
            <button data-tool="neg" class="tool" title="Add an exclude point to the selected object" aria-pressed="false" disabled>− Point</button>
          </div>
          <div id="objects"></div>
          <button id="btn-clear" disabled>Clear</button>
          <button id="btn-segment" class="primary" disabled>Segment objects</button>
        </section>

        <section>
          <button id="btn-dl-overlay" disabled>Download overlay</button>
          <button id="btn-dl-labels" disabled>Download label image</button>
        </section>
      </div>
    </aside>
  </main>

  <div id="toast" hidden></div>
  <div class="rotate-prompt" role="status">Please rotate your phone to landscape.</div>
  <script type="module" src="app.js"></script>
</body>
</html>
